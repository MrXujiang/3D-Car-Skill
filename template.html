<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070a;}
  canvas{display:block;cursor:grab;}

  #hud{
    position:fixed;left:32px;bottom:30px;pointer-events:none;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#cfd8dc;
  }
  #hud h1{font-size:26px;font-weight:800;letter-spacing:3px;line-height:1.1;
    text-shadow:0 0 24px rgba(120,255,190,.18);}
  #hud h1 span{color:#7ee2a8;}
  #hud p{font-size:11px;letter-spacing:5px;color:#6b7a83;margin-top:8px;}
  #hud .bar{width:52px;height:2px;background:linear-gradient(90deg,#7ee2a8,transparent);margin-top:12px;}
  #hud .copyright{font-size:10px;letter-spacing:2px;color:#4a5860;margin-top:10px;}

  #tip{
    position:fixed;right:32px;bottom:30px;font-size:11px;letter-spacing:2px;
    color:#4e5a62;font-family:-apple-system,"PingFang SC",sans-serif;
    text-align:right;line-height:1.8;
  }

  #panel{
    position:fixed;top:22px;right:22px;width:298px;
    background:rgba(11,17,21,.84);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid rgba(126,226,168,.14);
    border-radius:16px;
    padding:14px 18px 16px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#c6d2d8;
    max-height:calc(100vh - 44px);
    overflow-y:auto;overflow-x:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    user-select:none;
    scrollbar-width:thin;
    scrollbar-color:rgba(126,226,168,.25) transparent;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }
  #panel::-webkit-scrollbar{width:5px;}
  #panel::-webkit-scrollbar-thumb{background:rgba(126,226,168,.22);border-radius:3px;}
  #panel.collapsed{width:150px;overflow:hidden;}

  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;margin-bottom:14px;
  }
  #panel.collapsed .panel-head{margin-bottom:0;}

  .p-title{
    flex:1;
    font-size:11px;letter-spacing:4px;color:#7ee2a8;font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  .p-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(126,226,168,.35),transparent);}
  #panel.collapsed .p-title::after{display:none;}

  .fold{
    flex:none;width:18px;height:18px;border-radius:50%;
    background:rgba(126,226,168,.12);color:#7ee2a8;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;transition:transform .35s;
  }
  #panel.collapsed .fold{transform:rotate(-90deg);}

  .panel-body{
    max-height:5000px;opacity:1;overflow:hidden;
    transition:max-height .5s cubic-bezier(.4,0,.2,1), opacity .28s ease;
  }
  #panel.collapsed .panel-body{max-height:0;opacity:0;}

  .btn-engine{
    width:100%;height:44px;border-radius:11px;cursor:pointer;
    border:1px solid rgba(126,226,168,.45);
    background:linear-gradient(135deg,rgba(126,226,168,.16),rgba(126,226,168,.05));
    color:#d6fff0;font-size:13px;font-weight:700;letter-spacing:2px;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:.25s;font-family:inherit;margin-bottom:16px;
  }
  .btn-engine:hover{background:linear-gradient(135deg,rgba(126,226,168,.28),rgba(126,226,168,.10));}
  .btn-engine i{
    width:8px;height:8px;border-radius:50%;background:#7ee2a8;
    box-shadow:0 0 10px #7ee2a8;transition:.25s;
  }
  .btn-engine.on{
    border-color:rgba(255,120,90,.55);
    background:linear-gradient(135deg,rgba(255,120,90,.20),rgba(255,120,90,.06));
    color:#ffd9cd;
  }
  .btn-engine.on i{background:#ff7a5a;box-shadow:0 0 12px #ff7a5a;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .group{margin:16px 0 4px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06);}
  .group:first-of-type{border-top:none;padding-top:0;}
  .group-title{
    font-size:10px;letter-spacing:3px;color:#5f7a86;
    margin-bottom:12px;font-weight:700;
  }

  .ctrl{margin-bottom:13px;}
  .ctrl-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11px;letter-spacing:1px;color:#8b9aa3;margin-bottom:6px;
  }
  .ctrl-head b{color:#7ee2a8;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:3px;border-radius:2px;outline:none;cursor:pointer;
    background:rgba(255,255,255,.12);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#7ee2a8;border:2px solid #0b1115;
    box-shadow:0 0 9px rgba(126,226,168,.75);cursor:pointer;
    transition:transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18);}
  input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:#7ee2a8;
    border:2px solid #0b1115;box-shadow:0 0 9px rgba(126,226,168,.75);cursor:pointer;
  }

  .swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .swatch{
    width:24px;height:24px;border-radius:6px;cursor:pointer;padding:0;
    border:2px solid transparent;background:var(--c);transition:.2s;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
  }
  .swatch:hover{transform:translateY(-2px);}
  .swatch.active{border-color:#7ee2a8;box-shadow:0 0 10px rgba(126,226,168,.45);}

  .seg{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
  .seg button{
    flex:1;min-width:38px;height:26px;border-radius:6px;cursor:pointer;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.03);
    color:#8b9aa3;font-size:10px;letter-spacing:0.3px;
    font-family:inherit;transition:.2s;padding:0 2px;white-space:nowrap;
  }
  .seg button:hover{border-color:rgba(126,226,168,.30);color:#a8b8c0;}
  .seg button.on{
    border-color:rgba(126,226,168,.55);
    background:rgba(126,226,168,.15);
    color:#d6fff0;
  }

  .btn-upload{
    display:flex;align-items:center;justify-content:center;gap:6px;
    height:32px;border-radius:8px;cursor:pointer;margin-top:8px;
    border:1px dashed rgba(126,226,168,.35);
    background:rgba(126,226,168,.05);
    color:#7ee2a8;font-size:11px;letter-spacing:1px;
    transition:.2s;
  }
  .btn-upload:hover{border-color:rgba(126,226,168,.65);background:rgba(126,226,168,.10);}
  .btn-upload input{display:none;}
  .upload-name{
    font-size:10px;color:#5f7a86;margin-top:6px;letter-spacing:0.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;

  .switches{
    display:flex;flex-direction:column;gap:9px;
    margin:16px 0 12px;padding-top:14px;
    border-top:1px solid rgba(255,255,255,.07);
  }
  .sw{display:flex;align-items:center;justify-content:space-between;
    font-size:11.5px;letter-spacing:1px;color:#94a3ac;cursor:pointer;}
  .sw input{display:none;}
  .sw i{
    width:34px;height:18px;border-radius:9px;background:rgba(255,255,255,.10);

  }
  .sw i::after{
    content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;

  }

  .btn-ghost{
    width:100%;height:34px;border-radius:9px;cursor:pointer;
    border:1px solid rgba(255,255,255,.10);background:transparent;
    color:#8b9aa3;font-size:11px;letter-spacing:3px;font-family:inherit;
    transition:.22s;
  }
  .btn-ghost:hover{border-color:rgba(126,226,168,.4);color:#7ee2a8;}
</style>

          <button class="swatch" data-name="熔岩红" data-c="#b3232b" style="--c:#b3232b"></button>
          <button class="swatch" data-name="深海蓝" data-c="#1d3d63" style="--c:#1d3d63"></button>
          <button class="swatch" data-name="丛林绿" data-c="#45523c" style="--c:#45523c"></button>

      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span>副色（座舱/机甲）</span><b id="vAccent">星际黑</b></div>
        <div class="swatches" id="swatchAccent">
          <button class="swatch active" data-name="星际黑" data-c="#1a1c1e" style="--c:#1a1c1e"></button>
          <button class="swatch" data-name="碳纤灰" data-c="#3a3f44" style="--c:#3a3f44"></button>
          <button class="swatch" data-name="熔岩红" data-c="#8a1a1f" style="--c:#8a1a1f"></button>
          <button class="swatch" data-name="深海蓝" data-c="#16304a" style="--c:#16304a"></button>
          <button class="swatch" data-name="丛林绿" data-c="#2e3a26" style="--c:#2e3a26"></button>
          <button class="swatch" data-name="象牙白" data-c="#e8ecef" style="--c:#e8ecef"></button>

      <div class="ctrl">
        <div class="ctrl-head"><span>车漆质感</span></div>
        <div class="seg" id="segFinish">

      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span>轮毂颜色</span></div>
        <div class="swatches" id="swatchWheel">
          <button class="swatch active" data-rim="#23272a" data-bright="#9aa3a8" style="--c:linear-gradient(135deg,#9aa3a8,#3a3f44)"></button>
          <button class="swatch" data-rim="#141618" data-bright="#2c3034" style="--c:#202326"></button>
          <button class="swatch" data-rim="#4a3820" data-bright="#b08a50" style="--c:#8a6a3a"></button>
          <button class="swatch" data-rim="#08090a" data-bright="#1a1c1e" style="--c:#0a0b0c"></button>

          <button data-v="front">前脸</button>
          <button data-v="all">全车</button>

      <div class="ctrl">
        <div class="ctrl-head"><span>贴图重复 X</span><b id="vRepeatX">1.0</b></div>

      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span>贴图重复 Y</span><b id="vRepeatY">1.0</b></div>
        <input type="range" id="rngRepeatY" min="1" max="10" step="0.5" value="1">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span>贴图偏移 X</span><b id="vOffsetX">0.00</b></div>
        <input type="range" id="rngOffsetX" min="-1" max="1" step="0.05" value="0">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span>贴图偏移 Y</span><b id="vOffsetY">0.00</b></div>
        <input type="range" id="rngOffsetY" min="-1" max="1" step="0.05" value="0">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span>贴图透明度</span><b id="vDecalAlpha">100%</b></div>

        <div class="seg" id="segTint">

          <button data-v="dark" class="on">深色</button>
          <button data-v="privacy">隐私</button>
        </div>
      </div>
    </div>

      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span>车身角度</span><b id="vYaw">0°</b></div>
        <input type="range" id="rngYaw" min="-180" max="180" value="0">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span>悬架高度</span></div>
        <div class="seg" id="segSusp">
          <button data-v="low">低趴</button>
          <button data-v="std" class="on">标准</button>
          <button data-v="off">越野</button>
        </div>
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><span>前轮转向</span><b id="vSteer">0°</b></div>
        <input type="range" id="rngSteer" min="-30" max="30" value="0">

    </div>

    <div class="group">
      <div class="group-title">相 机 视 角</div>

      <div class="ctrl">
        <div class="ctrl-head"><span>视角俯仰</span><b id="vPitch">78°</b></div>
        <input type="range" id="rngPitch" min="15" max="88" value="78">

      <div class="ctrl">
        <div class="ctrl-head"><span>相机距离</span><b id="vDist">9.9</b></div>

          <button data-v="side">侧45</button>
          <button data-v="rear">尾部</button>
          <button data-v="top">俯视</button>
        </div>
      </div>
    </div>

    <div class="switches">
      <label class="sw"><span>自动环绕</span><input type="checkbox" id="chkAuto" checked><i></i></label>

      <label class="sw"><span>氛围灯</span><input type="checkbox" id="chkAmbient" checked><i></i></label>
    </div>

    <button id="btnReset" class="btn-ghost">重 置 视 角</button>
  </div>
</div>

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  r = Math.min(r, w / 2, h / 2);
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function extrudeRounded(w, h, r, depth, bevel = 0.04) {
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(w, h, r), {
    depth,
    bevelEnabled: bevel > 0,
    bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3,
    curveSegments: 10, steps: 1
  });
  geo.translate(0, 0, -depth / 2);
  geo.computeVertexNormals();
  return geo;
}

const noseCurve = new THREE.CubicBezierCurve(
  new THREE.Vector2(BODY.uF - 0.10, BODY.vB),
  new THREE.Vector2(BODY.uF + 0.09, BODY.vB + 0.42),
  new THREE.Vector2(BODY.uF + 0.01, BODY.vT - 0.28),
  new THREE.Vector2(BODY.uF - 0.30, BODY.vT)
);

function noseZ(relY) {
  let lo = 0, hi = 1;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) * 0.5;
    if (noseCurve.getPoint(mid).y < relY) lo = mid; else hi = mid;
  }
  return noseCurve.getPoint((lo + hi) * 0.5).x;
}

function archPoints(cx, cy, r, y0, seg = 30) {
  const dv = y0 - cy;
  const halfW = Math.sqrt(Math.max(r * r - dv * dv, 0));
  const a0 = Math.atan2(dv, -halfW);
  const a1 = Math.atan2(dv, halfW);
  const pts = [];
  for (let i = 1; i <= seg; i++) {
    const a = a0 + (a1 - a0) * (i / seg);
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts;
}

function buildBodyShape() {
  const { uR, vB, vT, archR, axF, axR, archY } = BODY;
  const s = new THREE.Shape();
  const fw = Math.sqrt(archR * archR - Math.pow(vB - archY, 2));

  s.moveTo(uR + 0.06, vB);
  s.lineTo(axR - fw, vB);
  for (const p of archPoints(axR, archY, archR, vB)) s.lineTo(p[0], p[1]);
  s.lineTo(axF - fw, vB);
  for (const p of archPoints(axF, archY, archR, vB)) s.lineTo(p[0], p[1]);
  for (const p of noseCurve.getPoints(30)) s.lineTo(p.x, p.y);

  s.lineTo(uR + 0.12, vT);
  s.quadraticCurveTo(uR, vT, uR, vT - 0.14);
  s.lineTo(uR, vB + 0.20);
  s.quadraticCurveTo(uR, vB, uR + 0.06, vB);
  return s;
}

/* --- 生成内置贴图 --- */
function makeDecalTexture(type) {
  const W = 512, H = 512;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  if (type === 'mecha') {
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-0.6);
    for (let i = -900; i < 900; i += 96) {
      ctx.fillStyle = 'rgba(20,24,28,0.78)';
      ctx.fillRect(i, -700, 46, 1400);
      ctx.fillStyle = 'rgba(255,140,40,0.92)';
      ctx.fillRect(i + 46, -700, 7, 1400);
    }
    ctx.restore();
  } else if (type === 'racing') {
    ctx.fillStyle = 'rgba(245,245,250,0.94)';
    ctx.fillRect(W * 0.34, 0, W * 0.06, H);
    ctx.fillRect(W * 0.60, 0, W * 0.06, H);
    ctx.fillStyle = 'rgba(200,30,30,0.94)';
    ctx.fillRect(W * 0.33, 0, 4, H);
    ctx.fillRect(W * 0.67, 0, 4, H);
  } else if (type === 'digital') {
    for (let i = 0; i < 62; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      const s = 12 + Math.random() * 36;
      ctx.fillStyle = i % 3 === 0
        ? 'rgba(60,80,95,0.62)'
        : 'rgba(30,36,42,0.62)';
      ctx.fillRect(x, y, s, s * 0.68);
    }
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/* --- 贴图状态 --- */
let currentDecalTex = null;
let customDecalTex = null;
let decalPos = 'hood';

/* 应用当前纹理到所有材质的 map */
function syncTextureToAll() {
  for (const key in decalPositions) {
    const m = decalPositions[key].mat;
    m.map = currentDecalTex;
    m.needsUpdate = true;
  }
}

/* 更新可见性 */
function updateDecalVisibility() {
  for (const key in decalPositions) {
    const obj = decalPositions[key];
    const show = !!currentDecalTex && (decalPos === 'all' || decalPos === key);
    obj.mesh.visible = show;
  }
}

/* 更新纹理 repeat / offset */
function applyRepeatOffset() {
  if (!currentDecalTex) return;
  const rx = parseFloat($('rngRepeatX').value);
  const ry = parseFloat($('rngRepeatY').value);
  const ox = parseFloat($('rngOffsetX').value);
  const oy = parseFloat($('rngOffsetY').value);

  currentDecalTex.wrapS = THREE.RepeatWrapping;
  currentDecalTex.wrapT = THREE.RepeatWrapping;
  currentDecalTex.repeat.set(rx, ry);
  currentDecalTex.offset.set(ox, oy);
  currentDecalTex.needsUpdate = true;

  $('vRepeatX').textContent = rx.toFixed(1);
  $('vRepeatY').textContent = ry.toFixed(1);
  $('vOffsetX').textContent = ox.toFixed(2);
  $('vOffsetY').textContent = oy.toFixed(2);
}

/* 应用贴图类型 */
function applyDecal(v) {
  if (v === 'none') {
    currentDecalTex = null;
    syncTextureToAll();
    updateDecalVisibility();
    return;
  }

  let tex = null;
  if (v === 'custom') {
    if (!customDecalTex) {
      alert('请先上传一张自定义贴图');
      document.querySelectorAll('#segDecal button').forEach(b => {
        b.classList.toggle('on', b.dataset.v === 'none');
      });
      currentDecalTex = null;
      syncTextureToAll();
      updateDecalVisibility();
      return;
    }
    tex = customDecalTex;
  } else {
    tex = decalTextures[v];
  }

  currentDecalTex = tex;
  applyRepeatOffset();
  syncTextureToAll();
  updateDecalVisibility();
}

function placeWindowGlass(A, B, width, offset) {
  const mid = A.clone().add(B).multiplyScalar(0.5);
  const t = B.clone().sub(A);
  const len = t.length();
  t.normalize();
  const n = new THREE.Vector3(0, -t.z, t.y);
  const pos = mid.clone().addScaledVector(n, offset);
  const geo = new THREE.BoxGeometry(width, len * 0.95, 0.03);
  const mesh = new THREE.Mesh(geo, MAT.glass);
  mesh.position.copy(pos);
  mesh.rotation.x = Math.atan2(-n.y, n.z);
  return mesh;
}

/* ---------- 雨刮器（四元数精确贴合玻璃） ---------- */
const WS_BOTTOM = new THREE.Vector3(0, 1.55, 0.55);
const WS_TOP    = new THREE.Vector3(0, 1.99, 0.07);
const wsUp = WS_TOP.clone().sub(WS_BOTTOM).normalize();
const wsNormal = new THREE.Vector3(0, -wsUp.z, wsUp.y).normalize();

const wiperQuat = (() => {
  const xAxis = new THREE.Vector3().crossVectors(wsNormal, wsUp).normalize();
  const m = new THREE.Matrix4().makeBasis(xAxis, wsNormal.clone(), wsUp.clone());
  return new THREE.Quaternion().setFromRotationMatrix(m);
})();

function makePlateTexture(text) {
  const W = 1024, H = 256;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#12252f');
  g.addColorStop(0.55, '#0a1720');
  g.addColorStop(1, '#061016');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#5fe3b0';
  ctx.lineWidth = 9;
  ctx.strokeRect(12, 12, W - 24, H - 24);

  ctx.strokeStyle = 'rgba(95,227,176,0.30)';
  ctx.lineWidth = 2;
  ctx.strokeRect(28, 28, W - 56, H - 56);

  const fontOf = (s) => `bold ${s}px "PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif`;
  let fs = 120;
  ctx.font = fontOf(fs);
  while (ctx.measureText(text).width > W - 100 && fs > 22) {
    fs -= 4;
    ctx.font = fontOf(fs);
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(95,227,176,0.85)';
  ctx.shadowBlur = 22;
  ctx.fillStyle = '#eafff8';
  ctx.fillText(text, W / 2, H / 2 + 4);

  ctx.shadowBlur = 8;
  ctx.fillText(text, W / 2, H / 2 + 4);

  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createCabinInterior(side, isFront) {
  const hingeZ = isFront ? DOOR_FRONT_HINGE_Z : DOOR_REAR_HINGE_Z;
  const len = isFront
    ? (DOOR_FRONT_HINGE_Z - DOOR_EDGE_Z)
    : (DOOR_EDGE_Z - DOOR_REAR_HINGE_Z);
  const dir = isFront ? -1 : 1;
  const midZ = hingeZ + dir * len / 2;

  const back = new THREE.Mesh(new THREE.BoxGeometry(0.008, DOOR_H - 0.10, len - 0.08), MAT.trimBrown);
  back.position.set(side * 0.926, DOOR_CY + 0.005, midZ);
  back.receiveShadow = true;

function makeMirrorShellShape() {
  const s = new THREE.Shape();
  const hl = 0.125, hh = 0.0725;
  s.moveTo(-hl + 0.03, -hh);
  s.quadraticCurveTo(-hl - 0.012, -hh * 0.4, -hl - 0.006, 0);
  s.quadraticCurveTo(-hl - 0.002, hh * 0.55, -hl + 0.035, hh * 0.88);
  s.quadraticCurveTo(-hl + 0.09, hh, 0, hh);
  s.quadraticCurveTo(hl - 0.05, hh, hl - 0.008, hh * 0.7);
  s.quadraticCurveTo(hl + 0.006, hh * 0.35, hl + 0.006, 0);
  s.quadraticCurveTo(hl + 0.006, -hh * 0.35, hl - 0.008, -hh * 0.7);
  s.quadraticCurveTo(hl - 0.05, -hh, 0, -hh);
  s.quadraticCurveTo(-hl + 0.09, -hh, -hl + 0.03, -hh);
  return s;
}

const WHEEL_Y = 0.448;

function makeWheel() {
  const g = new THREE.Group();
  const TR = 0.42, TW = 0.38;

  const tireGeo = new THREE.CylinderGeometry(TR, TR, TW, 40, 1);
  tireGeo.rotateZ(Math.PI / 2);
  const tire = new THREE.Mesh(tireGeo, MAT.tire);
  tire.castShadow = true;
  tire.receiveShadow = true;
  g.add(tire);

  for (const sx of [-TW / 2 + 0.02, TW / 2 - 0.02]) {
    const sidewall = new THREE.Mesh(new THREE.TorusGeometry(TR - 0.045, 0.038, 8, 32), MAT.tire);
    sidewall.rotation.y = Math.PI / 2;
    sidewall.position.x = sx;
    g.add(sidewall);
  }

  const treadCount = 18, treadRows = 3;
  const treadR = TR + 0.012, blockH = 0.032;
  const blockW = (TW / treadRows) * 0.86, blockD = 0.062;

  for (let row = 0; row < treadRows; row++) {
    const rowX = -TW / 2 + (row + 0.5) * (TW / treadRows);
    const aOff = (row % 2) * (Math.PI / treadCount);
    for (let i = 0; i < treadCount; i++) {
      const a = (i / treadCount) * Math.PI * 2 + aOff;
      const block = new THREE.Mesh(new THREE.BoxGeometry(blockW, blockH, blockD), MAT.tire);
      block.position.set(rowX, Math.cos(a) * treadR, Math.sin(a) * treadR);
      block.rotation.x = a;
      block.castShadow = true;
      g.add(block);
    }
  }

  const rimGeo = new THREE.CylinderGeometry(0.30, 0.30, TW + 0.02, 28);
  rimGeo.rotateZ(Math.PI / 2);
  const rim = new THREE.Mesh(rimGeo, MAT.rim);
  g.add(rim);

  for (const sx of [-TW / 2 - 0.005, TW / 2 + 0.005]) {
    const ringGeo = new THREE.TorusGeometry(0.30, 0.028, 8, 30);
    ringGeo.rotateY(Math.PI / 2);
    const ring = new THREE.Mesh(ringGeo, MAT.rimBright);
    ring.position.x = sx;
    g.add(ring);
  }

  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    for (const sx of [-TW / 2 - 0.002, TW / 2 + 0.002]) {
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.215, 0.062), MAT.rimBright);
      spoke.position.set(sx, Math.cos(a) * 0.13, Math.sin(a) * 0.13);
      spoke.rotation.x = a;
      g.add(spoke);
    }
  }

  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + Math.PI / 5;
    for (const sx of [-TW / 2 - 0.014, TW / 2 + 0.014]) {
      const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.018, 6), MAT.chrome);
      bolt.rotation.z = Math.PI / 2;
      bolt.position.set(sx, Math.cos(a) * 0.195, Math.sin(a) * 0.195);
      g.add(bolt);
    }
  }

  const capGeo = new THREE.CylinderGeometry(0.085, 0.085, TW + 0.04, 16);
  capGeo.rotateZ(Math.PI / 2);
  g.add(new THREE.Mesh(capGeo, MAT.rim));

  const discGeo = new THREE.CylinderGeometry(0.215, 0.215, 0.022, 28);
  discGeo.rotateZ(Math.PI / 2);
  const disc = new THREE.Mesh(discGeo, brakeDiscMat);
  disc.position.x = 0.02;
  g.add(disc);

  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const hole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.014, 0.014, 0.026, 8),
      new THREE.MeshStandardMaterial({ color: 0x08090a, roughness: 0.9 })
    );
    hole.rotation.z = Math.PI / 2;
    hole.position.set(0.02, Math.cos(a) * 0.15, Math.sin(a) * 0.15);
    g.add(hole);
  }

  return g;
}

  state.engineOn = !state.engineOn;

      vSpeed.textContent = '40';

  const v = Number(rngSpeed.value);
  vSpeed.textContent = v;

    state.engineOn = true;
    ignitePulse = 0.6;

    btnEngine.querySelector('span').textContent = '熄 火';

    btnEngine.classList.remove('on');

const META = CONFIG.meta || {};

function buildSwatch(container, item, active) {
  const b = document.createElement('button');
  b.className = 'swatch' + (active ? ' active' : '');
  for (const k in item) {
    if (k === 'css') b.style.setProperty('--c', item.css);
    else if (k === 'name') b.dataset.name = item.name;
    else b.dataset[k] = item[k];
  }
  /* 主色/副色/卡钳只有 c 字段：确保色块背景 --c 被写入 */
  if (!b.style.getPropertyValue('--c') && (item.css || item.c)) b.style.setProperty('--c', item.css || item.c);
  container.appendChild(b);
  return b;
}

/* HUD 品牌文案（只改文本节点，保留版权行） */
function setEl(id, text) { const el = $(id); if (el && text) el.textContent = text; }
const hudH1 = document.querySelector('#hud h1');
if (BRAND.titleMain != null && hudH1.childNodes[0]) hudH1.childNodes[0].nodeValue = BRAND.titleMain + ' ';
if (BRAND.titleAccent) setEl('hudAccent', BRAND.titleAccent);
if (BRAND.titleSuffix && hudH1.childNodes[2]) hudH1.childNodes[2].nodeValue = ' ' + BRAND.titleSuffix;
if (BRAND.hudSubtitle) setEl('hudSubtitle', BRAND.hudSubtitle);
if (META.copyright) setEl('hudCopyright', META.copyright);
if (META.title) document.title = META.title;
else if (BRAND.titleMain) document.title = (BRAND.titleMain + ' ' + (BRAND.titleAccent || '') + ' ' + (BRAND.titleSuffix || '')).trim() + ' · 3D';

/* 主体色 */
const vColor = $('vColor');
const swatchMain = $('swatchMain');
const normHex = h => String(h || '').toLowerCase();
const mainColors = PALETTE.mainColors;
let mainActiveIdx = 0;
if (Array.isArray(mainColors) && mainColors.length) {
  const m = mainColors.findIndex(c => normHex(c.c) === normHex(INITIAL.paint));
  mainActiveIdx = m >= 0 ? m : 0;
  swatchMain.innerHTML = '';
  mainColors.forEach((c, i) => {
    const b = buildSwatch(swatchMain, { name: c.name || ('配色' + (i + 1)), c: c.c }, i === mainActiveIdx);
    b.addEventListener('click', () => {
      swatchMain.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      targetPaintColor.set(c.c); vColor.textContent = c.name || ('配色' + (i + 1));
    });
  });
  vColor.textContent = mainColors[mainActiveIdx].name || ('配色' + (mainActiveIdx + 1));
} else {
  swatchMain.querySelectorAll('.swatch').forEach(btn => btn.addEventListener('click', () => {
    swatchMain.querySelectorAll('.swatch').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    targetPaintColor.set(btn.dataset.c);
    vColor.textContent = btn.dataset.name;
  }));
}

    const b = buildSwatch(swatchAccent, { name: c.name || ('副色' + (i + 1)), c: c.c }, i === activeIdx);
    b.addEventListener('click', () => {
      swatchAccent.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
      b.classList.add('active');

    });
  });

} else {
  swatchAccent.querySelectorAll('.swatch').forEach(btn => btn.addEventListener('click', () => {
    swatchAccent.querySelectorAll('.swatch').forEach(b => b.classList.remove('active'));

const wheelColors = PALETTE.wheelColors;

/* 卡钳色 */
const swatchCaliper = $('swatchCaliper');
const caliperColors = PALETTE.caliperColors;
if (Array.isArray(caliperColors) && caliperColors.length) {
  const hexAt = c => (typeof c === 'string' ? c : c.c);
  const m = caliperColors.findIndex(c => normHex(hexAt(c)) === normHex(INITIAL.caliper));

      b.classList.add('active');
      targetCaliperColor.set(hex);
    });

} else {

    swatchCaliper.querySelectorAll('.swatch').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    targetCaliperColor.set(btn.dataset.c);

bindSeg('segFinish', v => {
  if (v === 'matte') finish.target = { rough: 0.58, cc: 0.15, ccR: 0.55 };
  else if (v === 'standard') finish.target = { rough: 0.22, cc: 1.0, ccR: 0.08 };
  else if (v === 'pearl') finish.target = { rough: 0.14, cc: 1.0, ccR: 0.02 };
});
const finishPresets = {
  matte: { rough: 0.58, cc: 0.15, ccR: 0.55 },
  standard: { rough: 0.22, cc: 1.0, ccR: 0.08 },
  pearl: { rough: 0.14, cc: 1.0, ccR: 0.02 }
};
if (finishPresets[INITIAL.finish]) {
  finish.target = { ...finishPresets[INITIAL.finish] };
  finish.current = { ...finishPresets[INITIAL.finish] };
  document.querySelectorAll('#segFinish button').forEach(b => b.classList.toggle('on', b.dataset.v === INITIAL.finish));
}


/* ---------- 贴图上传 ---------- */
const fileDecal = $('fileDecal');
const uploadName = $('uploadName');

fileDecal.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    alert('请选择图片文件');
    return;
  }
  uploadName.textContent = file.name;

  const reader = new FileReader();
  reader.onload = ev => {
    const loader = new THREE.TextureLoader();
    loader.load(ev.target.result, tex => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      customDecalTex = tex;

      document.querySelectorAll('#segDecal button').forEach(b => b.classList.remove('on'));
      const btn = document.querySelector('#segDecal button[data-v="custom"]');
      if (btn) btn.classList.add('on');
      applyDecal('custom');
    }, undefined, () => {
      alert('图片加载失败，请换一张试试');
    });
  };
  reader.readAsDataURL(file);
});

bindSeg('segDecal', applyDecal);

/* 初始贴图（initial.decal: none/mecha/racing/digital）与初始位置（initial.decalPos） */
if (INITIAL.decal && INITIAL.decal !== 'none' && decalTextures[INITIAL.decal]) {
  document.querySelectorAll('#segDecal button').forEach(b => b.classList.toggle('on', b.dataset.v === INITIAL.decal));
  applyDecal(INITIAL.decal);
}
if (typeof INITIAL.decalPos === 'string' && (INITIAL.decalPos === 'all' || decalPositions[INITIAL.decalPos])) {
  decalPos = INITIAL.decalPos;
  document.querySelectorAll('#segDecalPos button').forEach(b => b.classList.toggle('on', b.dataset.v === decalPos));
  updateDecalVisibility();
}

/* 贴图位置 */
bindSeg('segDecalPos', v => {
  decalPos = v;
  updateDecalVisibility();
});

/* 重复 / 偏移 */
['rngRepeatX', 'rngRepeatY', 'rngOffsetX', 'rngOffsetY'].forEach(id => {
  $(id).addEventListener('input', () => {
    applyRepeatOffset();
  });
});

/* 贴图透明度 */
const rngDecalAlpha = $('rngDecalAlpha');
const vDecalAlpha = $('vDecalAlpha');
rngDecalAlpha.addEventListener('input', () => {
  const a = Number(rngDecalAlpha.value) / 100;
  for (const key in decalPositions) {
    decalPositions[key].mat.opacity = a;
  }
  vDecalAlpha.textContent = rngDecalAlpha.value + '%';
});

/* 车窗贴膜 */
bindSeg('segTint', v => {
  const p = tintPresets[v];
  targetTint.opacity = p.opacity;
  targetTint.color.set(p.color);
});

/* 模型缩放 */
const rngScale = $('rngScale');
const vScale = $('vScale');
rngScale.addEventListener('input', () => {
  const s = Number(rngScale.value) / 100;
  car.scale.setScalar(s);
  vScale.textContent = s.toFixed(2) + '×';
});

/* 车身角度 */
const rngYaw = $('rngYaw');
const vYaw = $('vYaw');
rngYaw.addEventListener('input', () => {
  const d = Number(rngYaw.value);
  car.rotation.y = THREE.MathUtils.degToRad(d);
  vYaw.textContent = d + '°';
});

bindSeg('segSusp', v => {
  if (v === 'low') suspension.target = -0.06;
  else if (v === 'std') suspension.target = 0;
  else if (v === 'off') suspension.target = 0.07;
});
const suspTargets = { low: -0.06, std: 0, off: 0.07 };
if (suspTargets[INITIAL.suspension] != null) {
  suspension.target = suspTargets[INITIAL.suspension];
  suspension.current = suspension.target;
  document.querySelectorAll('#segSusp button').forEach(b => b.classList.toggle('on', b.dataset.v === INITIAL.suspension));
}

const rngSteer = $('rngSteer');
const vSteer = $('vSteer');
rngSteer.addEventListener('input', () => {
  const d = Number(rngSteer.value);
  vSteer.textContent = d + '°';
  steer.target = THREE.MathUtils.degToRad(d);
});

/* 相机 */
const rngPitch = $('rngPitch');
const vPitch = $('vPitch');
const rngDist = $('rngDist');
const vDist = $('vDist');

let camSliderActive = false;

function applyCamera() {
  const polar = THREE.MathUtils.degToRad(Number(rngPitch.value));
  const dist = Number(rngDist.value) / 10;
  const az = controls.getAzimuthalAngle();
  const sph = new THREE.Spherical(dist, polar, az);
  camera.position.setFromSpherical(sph).add(controls.target);
  controls.update();
  vPitch.textContent = rngPitch.value + '°';
  vDist.textContent = dist.toFixed(1);
}

[rngPitch, rngDist].forEach(el => {
  el.addEventListener('pointerdown', () => { camSliderActive = true; });
  el.addEventListener('pointerup', () => { setTimeout(() => camSliderActive = false, 60); });
  el.addEventListener('pointercancel', () => { setTimeout(() => camSliderActive = false, 60); });
  el.addEventListener('input', applyCamera);
});

bindSeg('segCam', v => {
  let yaw = 0, pitch = 78, dist = 99;
  if (v === 'front') { yaw = 0; pitch = 78; dist = 99; }
  else if (v === 'side') { yaw = 55; pitch = 80; dist = 105; }
  else if (v === 'rear') { yaw = 180; pitch = 78; dist = 99; }
  else if (v === 'top') { yaw = 0; pitch = 26; dist = 115; }

  rngYaw.value = yaw;
  rngPitch.value = pitch;
  rngDist.value = dist;
  car.rotation.y = THREE.MathUtils.degToRad(yaw);
  vYaw.textContent = yaw + '°';
  applyCamera();
});

$('chkAuto').checked = INITIAL.autoRotate !== false;
$('chkAuto').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
$('chkLight').checked = INITIAL.lightsOn !== false;
$('chkLight').addEventListener('change', (e) => { state.lightsOn = e.target.checked; });
$('chkBlue').checked = INITIAL.blueOn !== false;
$('chkBlue').addEventListener('change', (e) => { state.blueOn = e.target.checked; });
$('chkAmbient').checked = INITIAL.ambientOn !== false;
$('chkAmbient').addEventListener('change', (e) => {
  state.ambientOn = e.target.checked;
  MAT.ambientGlow.color.set(state.ambientOn ? 0x35c8ff : 0x0a1a24);
});

$('btnReset').addEventListener('click', () => {
  controls.target.set(0, 1.05, 0);
  rngPitch.value = 78;
  rngDist.value = 99;
  rngYaw.value = 0;
  car.rotation.y = 0;
  vYaw.textContent = '0°';
  applyCamera();
});

/* 点击交互 */
const raycaster = new THREE.Raycaster();
const pointerVec = new THREE.Vector2();
const canvas = renderer.domElement;
let downX = 0, downY = 0;

function setPointerFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  pointerVec.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerVec.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

function pickDoorAnim(e) {
  setPointerFromEvent(e);
  raycaster.setFromCamera(pointerVec, camera);
  const hits = raycaster.intersectObjects(clickables, false);
  if (hits.length > 0) return hits[0].object.userData.doorAnim || null;
  return null;
}

canvas.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });

canvas.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  const anim = pickDoorAnim(e);
  if (anim) anim.target = anim.target === 0 ? anim.openAngle : 0;
});

canvas.addEventListener('pointermove', (e) => {
  if (e.buttons !== 0) { canvas.style.cursor = 'grabbing'; return; }
  canvas.style.cursor = pickDoorAnim(e) ? 'pointer' : 'grab';
});

canvas.addEventListener('pointerleave', () => { canvas.style.cursor = 'grab'; });

/* 动画循环 */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  const prevSpeed = state.speed;
  state.speed += (state.targetSpeed - state.speed) * Math.min(1, dt * 2.2);
  state.braking = (state.targetSpeed < state.speed - 4) && state.speed > 6;

  const jitterTarget = state.engineOn ? 1 : 0;
  engineJitter += (jitterTarget - engineJitter) * Math.min(1, dt * 4.5);
  ignitePulse = Math.max(0, ignitePulse - dt * 1.6);

  suspension.current += (suspension.target - suspension.current) * Math.min(1, dt * 5);
  for (const o of wheelOuters) o.position.y = WHEEL_Y - suspension.current;

  steer.current += (steer.target - steer.current) * Math.min(1, dt * 6);
  for (const s of frontOuters) s.rotation.y = steer.current;

  const bob = Math.sin(t * 1.2) * 0.008;
  const shake = Math.sin(t * 46) * 0.0045 * engineJitter
              + Math.sin(t * 73) * 0.012 * ignitePulse;
  car.position.y = bob + shake + suspension.current;
  car.rotation.z = Math.sin(t * 39) * 0.0022 * engineJitter;

  const accel = (state.speed - prevSpeed) / Math.max(dt, 0.001);
  const pitchTarget = THREE.MathUtils.clamp(-accel * 0.004, -0.018, 0.018);
  car.rotation.x += (pitchTarget - car.rotation.x) * Math.min(1, dt * 4);

  const spin = state.speed * 0.55 * dt;
  for (const w of wheelGroups) w.rotation.x -= spin;

  const flow = state.speed * dt * 0.10;
  if (flow > 0) {
    grid.position.z = ((grid.position.z - flow) % 1 + 1) % 1;
    for (const c of cones) {
      c.position.z -= flow;
      if (c.position.z < CONE_BACK) c.position.z += CONE_SPAN;
    }
  }

  carShadow.scale.set(car.scale.x, car.scale.x, 1);

  for (const a of doorAnims) {
    a.current += (a.target - a.current) * Math.min(1, dt * 5.5);
    if (a.axis === 'y') a.obj.rotation.y = a.current;
  }

  trunkAnim.current += (trunkAnim.target - trunkAnim.current) * Math.min(1, dt * 5.0);
  trunkAnim.obj.rotation.x = trunkAnim.current;

  MAT.paint.color.lerp(targetPaintColor, Math.min(1, dt * 6));
  MAT.paintBlack.color.lerp(targetAccentColor, Math.min(1, dt * 6));

  finish.current.rough += (finish.target.rough - finish.current.rough) * Math.min(1, dt * 5);
  finish.current.cc += (finish.target.cc - finish.current.cc) * Math.min(1, dt * 5);
  finish.current.ccR += (finish.target.ccR - finish.current.ccR) * Math.min(1, dt * 5);

  MAT.paint.roughness = finish.current.rough;
  MAT.paint.clearcoat = finish.current.cc;
  MAT.paint.clearcoatRoughness = finish.current.ccR;

  MAT.paintBlack.roughness = Math.min(0.98, finish.current.rough + 0.04);
  MAT.paintBlack.clearcoat = finish.current.cc;
  MAT.paintBlack.clearcoatRoughness = finish.current.ccR;

  MAT.rim.color.lerp(targetWheelRim, Math.min(1, dt * 6));
  MAT.rimBright.color.lerp(targetWheelBright, Math.min(1, dt * 6));
  caliperMat.color.lerp(targetCaliperColor, Math.min(1, dt * 6));

  MAT.glass.opacity += (targetTint.opacity - MAT.glass.opacity) * Math.min(1, dt * 5);
  MAT.glass.color.lerp(targetTint.color, Math.min(1, dt * 5));

  const lightTarget = (state.engineOn && state.lightsOn) ? 1 : 0;
  lightLevel += (lightTarget - lightLevel) * Math.min(1, dt * 2.4);

  MAT.lightOn.emissiveIntensity = 0.22 + lightLevel * 2.2;
  MAT.tailOn.emissiveIntensity = 0.28 + lightLevel * 1.55;

  const brakeBoost = state.braking ? 2.2 : 0;
  tailBarMat.emissiveIntensity = 0.45 + lightLevel * 2.2 + brakeBoost;

  for (const hl of headLightLights) hl.intensity = lightLevel * 2.8;

  const blinkSpeed = state.engineOn ? 8.6 : 5.0;
  const blinkA = 0.5 + 0.5 * Math.sin(t * blinkSpeed);
  const blinkB = 0.5 + 0.5 * Math.sin(t * blinkSpeed + Math.PI);

  if (state.blueOn) {
    blueLampMats[0].emissiveIntensity = 0.30 + blinkA * 3.9;
    blueLampMats[1].emissiveIntensity = 0.30 + blinkB * 3.9;
    blueLampLights[0].intensity = blinkA * 1.8;
    blueLampLights[1].intensity = blinkB * 1.8;
  } else {
    blueLampMats[0].emissiveIntensity = 0.25;
    blueLampMats[1].emissiveIntensity = 0.25;
    blueLampLights[0].intensity = 0;
    blueLampLights[1].intensity = 0;
  }

  if (state.ambientOn) {
    const amb = 0.55 + 0.25 * Math.sin(t * 1.8);
    MAT.ambientGlow.color.setRGB(0.10 * amb, 0.55 * amb, 0.95 * amb);
  }

  plateMat.emissiveIntensity = 0.42 + 0.18 * (0.5 + 0.5 * Math.sin(t * 1.6));

  if (!camSliderActive) {
    const d = camera.position.distanceTo(controls.target);
    const dir = camera.position.clone().sub(controls.target).normalize();
    const polarDeg = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(dir.y, -1, 1)));
    const dVal = Math.round(THREE.MathUtils.clamp(d, 5, 22) * 10);
    const pVal = Math.round(THREE.MathUtils.clamp(polarDeg, 15, 88));

    if (Number(rngDist.value) !== dVal) {
      rngDist.value = dVal;
      vDist.textContent = (dVal / 10).toFixed(1);
    }
    if (Number(rngPitch.value) !== pVal) {
      rngPitch.value = pVal;
      vPitch.textContent = pVal + '°';
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

(function initCamSliders() {
  const d = camera.position.distanceTo(controls.target);
  rngDist.value = Math.round(d * 10);
  vDist.textContent = d.toFixed(1);

  const dir = camera.position.clone().sub(controls.target).normalize();
  const polarDeg = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(dir.y, -1, 1)));
  rngPitch.value = Math.round(polarDeg);
  vPitch.textContent = Math.round(polarDeg) + '°';
})();
</script>
