<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="'PingFang SC','Microsoft YaHei',Segoe UI,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233d"/>
      <stop offset="0.55" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#04070c"/>
    </linearGradient>
    <radialGradient id="horizon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6f8f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f6f8f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1418"/>
      <stop offset="1" stop-color="#05080a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b444d"/>
      <stop offset="0.5" stop-color="#22282d"/>
      <stop offset="1" stop-color="#101418"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4150"/>
      <stop offset="1" stop-color="#0e161e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="520" fill="url(#sky)"/>
  <ellipse cx="470" cy="360" rx="420" ry="90" fill="url(#horizon)"/>
  <g fill="#cfe9ff" opacity="0.7">
    <circle cx="120" cy="70" r="1.4"/><circle cx="260" cy="48" r="1"/><circle cx="360" cy="92" r="1.2"/>
    <circle cx="640" cy="60" r="1"/><circle cx="720" cy="110" r="1.3"/><circle cx="80" cy="150" r="1"/>
    <circle cx="540" cy="40" r="1"/><circle cx="900" cy="70" r="1.1"/>
  </g>

  <!-- studio floor -->
  <ellipse cx="470" cy="372" rx="360" ry="46" fill="url(#floor)"/>
  <ellipse cx="470" cy="372" rx="360" ry="46" fill="none" stroke="#1f4a3c" stroke-width="1" opacity="0.5"/>

  <!-- car reflection -->
  <g transform="translate(0,748) scale(1,-1)" opacity="0.28" filter="url(#soft)">
    <path d="M150 300 Q170 250 250 244 L300 210 Q360 178 470 178 L560 182 Q640 190 700 236 L760 250 Q810 260 812 300 L800 330 L170 330 Z" fill="#1a2026"/>
  </g>

  <!-- car body -->
  <path d="M150 336 Q150 300 205 292 L250 250 Q320 206 470 206 L560 210 Q640 216 700 262 L762 280 Q812 292 815 330 L806 344 Q800 352 780 352 L188 352 Q162 352 150 344 Z" fill="url(#body)" stroke="#3a444d" stroke-width="1.2"/>
  <!-- teal rim-light top edge -->
  <path d="M205 292 L250 250 Q320 206 470 206 L560 210 Q640 216 700 262" fill="none" stroke="#7ee2a8" stroke-width="2.4" opacity="0.75"/>
  <!-- cabin glass -->
  <path d="M300 250 Q350 220 460 220 L520 224 Q560 230 596 256 L560 258 L320 258 Z" fill="url(#glass)" stroke="#4a6272" stroke-width="1"/>
  <path d="M410 222 L410 258" stroke="#0e161e" stroke-width="3"/>
  <!-- side skirt glow -->
  <path d="M188 344 L780 344" stroke="#35c8ff" stroke-width="2.4" opacity="0.4" filter="url(#soft)"/>

  <!-- wheels -->
  <g>
    <circle cx="286" cy="344" r="52" fill="#0e0e0e"/>
    <circle cx="286" cy="344" r="52" fill="none" stroke="#23272a" stroke-width="3"/>
    <circle cx="286" cy="344" r="24" fill="#23272a" stroke="#9aa3a8" stroke-width="3"/>
    <circle cx="688" cy="344" r="52" fill="#0e0e0e"/>
    <circle cx="688" cy="344" r="52" fill="none" stroke="#23272a" stroke-width="3"/>
    <circle cx="688" cy="344" r="24" fill="#23272a" stroke="#9aa3a8" stroke-width="3"/>
  </g>

  <!-- headlight + taillight -->
  <circle cx="806" cy="300" r="12" fill="#fff0c8" opacity="0.9" filter="url(#soft)"/>
  <rect x="152" y="298" width="16" height="10" rx="3" fill="#ff3b2f" opacity="0.85"/>

  <!-- right glass control panel -->
  <g>
    <rect x="884" y="60" width="292" height="360" rx="18" fill="url(#panel)" stroke="#7ee2a8" stroke-width="1.2" stroke-opacity="0.5"/>
    <text x="908" y="94" fill="#7ee2a8" font-size="15" font-weight="700" letter-spacing="2">CONFIG PANEL</text>
    <line x1="908" y1="106" x2="1152" y2="106" stroke="#ffffff" stroke-opacity="0.14"/>
    <!-- sliders -->
    <g stroke="#6b7a83" stroke-width="2">
      <line x1="908" y1="140" x2="1140" y2="140"/>
      <line x1="908" y1="182" x2="1140" y2="182"/>
      <line x1="908" y1="224" x2="1140" y2="224"/>
    </g>
    <g>
      <line x1="908" y1="140" x2="1040" y2="140" stroke="#7ee2a8" stroke-width="3"/>
      <circle cx="1040" cy="140" r="7" fill="#7ee2a8"/>
      <line x1="908" y1="182" x2="986" y2="182" stroke="#7ee2a8" stroke-width="3"/>
      <circle cx="986" cy="182" r="7" fill="#7ee2a8"/>
      <line x1="908" y1="224" x2="1104" y2="224" stroke="#35c8ff" stroke-width="3"/>
      <circle cx="1104" cy="224" r="7" fill="#35c8ff"/>
    </g>
    <text x="908" y="262" fill="#8b9aa3" font-size="12" letter-spacing="1">PAINT COLOR</text>
    <!-- swatches -->
    <g>
      <circle cx="922" cy="290" r="15" fill="#c9ced4" stroke="#7ee2a8" stroke-width="2.5"/>
      <circle cx="962" cy="290" r="15" fill="#b3232b"/>
      <circle cx="1002" cy="290" r="15" fill="#1d3d63"/>
      <circle cx="1042" cy="290" r="15" fill="#45523c"/>
      <circle cx="1082" cy="290" r="15" fill="#b39a63"/>
      <circle cx="1122" cy="290" r="15" fill="#dfe4e8"/>
    </g>
    <text x="908" y="342" fill="#8b9aa3" font-size="12" letter-spacing="1">DECALS · SUSPENSION · LIGHTS</text>
    <rect x="908" y="360" width="244" height="34" rx="10" fill="#7ee2a8" fill-opacity="0.16" stroke="#7ee2a8" stroke-opacity="0.6"/>
    <text x="1030" y="382" fill="#d6fff0" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="3">START ENGINE</text>
    <circle cx="990" cy="377" r="5" fill="#7ee2a8"/>
  </g>

  <!-- left HUD -->
  <g>
    <text x="60" y="420" fill="#cfd8dc" font-size="26" font-weight="800" letter-spacing="3">Jit <tspan fill="#7ee2a8">400</tspan></text>
    <text x="60" y="446" fill="#6b7a83" font-size="12" letter-spacing="5">OFF-ROAD · HYBRID · 3D</text>
    <rect x="60" y="456" width="52" height="3" fill="#7ee2a8"/>
  </g>
</svg>
